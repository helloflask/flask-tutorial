site_name: Flask Tutorial
site_description: Build your first web application with Python and Flask
site_url: https://tutorial.helloflask.com/en/
docs_dir: chapters/en
theme:
  name: material
  custom_dir: chapters/shared/_templates
  logo: _assets/favicon.png
  favicon: _assets/favicon.png
  features:
    - content.code.copy
  palette:
    primary: black
  icon:
    repo: fontawesome/brands/github
  language: en
repo_url: https://github.com/helloflask/flask-tutorial
repo_name: helloflask/flask-tutorial
extra:
  alternate:
    - name: 中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/helloflask/flask-tutorial
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/greylihui
copyright: Copyright &copy; 2025 <a href="https://greyli.com" target="_blank" rel="noopener">Grey Li</a>
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.progressbar
  - attr_list
  - toc:
        permalink: True
nav:
  - Introduction: README.md
  - Preface: preface.md
  - "Chapter 1: Getting ready": 1-preparation.md
  - "Chapter 2: Hello, Flask!": 2-hello.md
  - "Chapter 3: Templates": 3-template.md
  - "Chapter 4: Static files": 4-static.md
  - "Chapter 5: Databases": 5-database.md
  - "Chapter 6: Improving templates": 6-advanced-template.md
  - "Chapter 7: Forms": 7-form.md
  - Chinese edition (complete): https://tutorial.helloflask.com/
  - Book homepage: https://helloflask.com/book/3
  - Book source: https://github.com/helloflask/flask-tutorial
  - Example application: https://github.com/helloflask/watchlist
plugins:
  - search
extra_css:
  - _assets/extra.css
